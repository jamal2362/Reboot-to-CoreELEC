plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing comes from the environment (see .github/workflows/release.yml).
// Without it, release builds are signed with the debug key so they can still be installed for testing.
def releaseKeystore = System.getenv('RELEASE_KEYSTORE_FILE')

android {
    namespace 'com.jamal2367.coreelec'
    compileSdk 37

    defaultConfig {
        applicationId 'com.jamal2367.coreelec'
        minSdk 24
        versionCode 61
        versionName '6.1'
    }

    androidResources {
        localeFilters += ['en', 'de', 'hu', 'zh-rCN', 'es']
    }

    signingConfigs {
        release {
            if (releaseKeystore) {
                storeFile file(releaseKeystore)
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
        }
        release {
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

base {
    archivesName = "Reboot_to_CoreELEC_${android.defaultConfig.versionName}"
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.compose.ui:ui'
    implementation 'com.tananaev:adblib:1.3'
}
