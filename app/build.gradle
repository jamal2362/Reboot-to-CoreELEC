plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.jamal2367.coreelec'
    compileSdk 36

    defaultConfig {
        applicationId 'com.jamal2367.coreelec'
        minSdk 24
        targetSdk 36
        versionCode 50
        versionName '5.0'
    }

    androidResources {
        localeFilters += ['en', 'de', 'hu']
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

base {
    archivesName = "Reboot_to_CoreELEC_${android.defaultConfig.versionName}"
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.compose.foundation:foundation'
    // Material 3 Expressive components are only available in the 1.5 line so far.
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.compose.ui:ui'
    implementation 'com.tananaev:adblib:1.3'
}
